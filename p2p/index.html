<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procure to Pay Prototype</title>
<meta name="description" content="Working wireframe prototype of OneCart 360, CreditIQ and DealFlow AI: one partner checkout, credit at checkout, and PO to revenue orchestration." />
<link rel="icon" type="image/png" href="../assets/img/logo-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
:root{
  --bg:#f5f5f3; --card:#fff; --ink:#141414; --ink2:#4d4d4d; --ink3:#8a8a86; --line:#e4e4df; --line2:#d3d3cd;
  --soft:#f0f0ec; --ac:#2453e6; --acs:#eaf0ff; --ok:#147a48; --oks:#e6f4ec; --wn:#a35f00; --wns:#fff3df;
  --bad:#c0332a; --bads:#fdecea; --ai:#6a46d6; --ais:#f0ebff; --note:#fff7c2; --noteb:#e9d55a;
  --r:10px; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Geist",system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.r{text-align:right} .nowrap{white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--sub);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.brand .lg{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:13.5px} .brand s{display:block;text-decoration:none;color:var(--ink3);font-size:11.5px}
.sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 4px;font-weight:600}
.sec em{font-style:normal;text-transform:none;letter-spacing:0;display:block;font-weight:400;font-size:11.5px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--soft);text-decoration:none}
.nav[aria-current=true]{background:var(--ink);color:var(--on-ink)}
.nav .ic{width:16px;text-align:center;opacity:.8;font-size:13px}
.nav .bd{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px;font-weight:600}
.nav .bd.n{background:var(--ac)} .nav .bd.g{background:var(--line2);color:var(--ink)}
.nav .tag{margin-left:auto;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.nav[aria-current=true] .tag{color:#bbb}
.side .foot{margin-top:auto;padding:12px 6px 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:4px 4px}
.sw{width:32px;height:18px;border-radius:99px;background:var(--line2);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--card);left:2px;top:2px;transition:.2s}
.sw[aria-pressed=true]{background:var(--ink)} .sw[aria-pressed=true]::after{left:16px}

.mainwrap{min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:56px}
.top .crumb{font-size:12.5px;color:var(--ink3)} .top .crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px}
.persona i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--ac)}
.persona.ops i{background:var(--ai)} .persona.cr i{background:var(--wn)} .persona.ad i{background:var(--ink)}
.mk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.mk select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px}
.menu-b{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer}
main{padding:24px 28px 80px;max-width:1280px}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{padding:0;overflow:hidden}
.card h2+p,.card h3+p{margin-top:4px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd p{color:var(--ink2);max-width:720px;margin-top:4px}
.pagehd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehd p{color:var(--ink2);margin-top:6px;max-width:760px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.split.w{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.hr{height:1px;background:var(--line);margin:14px 0}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)} .btn.pri:hover{background:#333}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#f0c4c0}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:11px 18px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--oks);color:var(--ok)} .pill.wn{background:var(--wns);color:var(--wn)} .pill.bad{background:var(--bads);color:var(--bad)}
.pill.ac{background:var(--acs);color:var(--ac)} .pill.ai{background:var(--ais);color:var(--ai)} .pill.ink{background:var(--ink);color:var(--on-ink)}
.pill.out{background:var(--card);border-color:var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink3)} .kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi .v.ok{color:var(--ok)} .kpi .v.wn{color:var(--wn)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sub);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--sub)}
.t tr.tot td{font-weight:600;background:var(--sub)}
.t td.r,.t th.r{text-align:right}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.ok{background:var(--ok)} .bar i.wn{background:var(--wn)} .bar i.ac{background:var(--ac)} .bar i.bad{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.inp{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
.inp:focus{outline:2px solid var(--acs);border-color:var(--ac)}
.qty{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.qty button{border:0;background:var(--card);width:28px;cursor:pointer} .qty button:hover{background:var(--soft)}
.qty input{width:56px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:5px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:36px;text-align:center;color:var(--ink3);background:var(--sub)}
.ph{background:repeating-linear-gradient(135deg,#f1f1ed 0 8px,#ebebe6 8px 16px);border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:11px;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:500}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)} .list>div:last-child{border-bottom:0}

/* annotations */
.ann{background:var(--note);border:1px solid var(--noteb);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--notetx);display:flex;gap:8px;align-items:flex-start}
.ann b{font-weight:600;white-space:nowrap}
.ann::before{content:"✎";font-size:12px}
body.no-notes .ann{display:none !important}

/* stepper */
.stepper{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;margin-bottom:16px}
.stepper button{flex:1;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;border-right:1px solid var(--line)}
.stepper button:last-child{border-right:0}
.stepper i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;flex:none}
.stepper b{font-weight:500;font-size:13px} .stepper s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink3)}
.stepper .on{background:var(--sub)} .stepper .on i{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.stepper .dn i{background:var(--ok);color:#fff;border-color:var(--ok)}
.stepper button[disabled]{cursor:not-allowed;opacity:.55}

/* pipeline */
.pipe{display:flex;gap:4px}
.pipe span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pipe span.d{background:var(--ok)} .pipe span.c{background:var(--ac);animation:pulse 1s infinite} .pipe span.h{background:var(--wn)}
@keyframes pulse{50%{opacity:.4}}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.tl .e{position:relative;padding:0 0 14px}
.tl .e::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--ok)}
.tl .e.p::before{border-color:var(--wn)} .tl .e.h::before{border-color:var(--ac)} .tl .e.x::before{border-color:var(--line2)}
.tl .e .m{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl .e .tx{font-size:13px;margin-top:2px}
.stg{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.stg:last-child{border-bottom:0}
.stg .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:11px;font-weight:600;color:var(--ink3)}
.stg.d .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stg.c .n{background:var(--ac);border-color:var(--ac);color:#fff}
.stg.h{background:var(--wns)} .stg.h .n{background:var(--wn);border-color:var(--wn);color:#fff}
.stg.f{color:var(--ink3)}

/* product tiles */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.tile .ph{height:84px}
.tile .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.tile .pr{font-size:15px;font-weight:600} .tile .pr s{text-decoration:none;color:var(--ink3);font-weight:400;font-size:12px}
.tile .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* route groups */
.txn{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.txn .th{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sub);border-bottom:1px solid var(--line);flex-wrap:wrap}
.txn .th .ix{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.txn.aws .th .ix{background:var(--wn)} .txn.ms .th .ix{background:var(--ac)} .txn.svc .th .ix{background:var(--ai)}
.txn .tb{padding:4px 14px}
.txn .ln{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.txn .ln:last-child{border-bottom:0}
.txn .tf{display:flex;gap:18px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.txn .tf b{color:var(--ink)}
.flag{border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.flag.wn{background:var(--wns);color:#6d4000} .flag.bad{background:var(--bads);color:#7c1e17} .flag.ok{background:var(--oks);color:#0d5130} .flag.ai{background:var(--ais);color:#3f2596} .flag.ac{background:var(--acs);color:#173a9e}
.flag b{font-weight:600}

/* options */
.opt{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);margin-top:2px}
.opt[aria-pressed=true] .rd{border:5px solid var(--ink)}
.opt b{font-weight:600;font-size:13px} .opt .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.opt .fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt .fx span{font-size:11.5px;background:var(--soft);border-radius:6px;padding:2px 7px;font-family:var(--mono)}
.opt .side-v{text-align:right;font-size:13px;font-weight:600} .opt .side-v em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400}
.optlist{display:flex;flex-direction:column;gap:8px}

/* credit */
.grade{width:76px;height:76px;border-radius:50%;border:6px solid var(--ok);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.sig{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.sig:last-child{border-bottom:0}
.sig s{display:block;text-decoration:none;color:var(--ink3);font-size:12px}
.sig.pend{opacity:.35}
.ledger{font-size:13px;width:100%;border-collapse:collapse}
.ledger td{padding:7px 0;border-bottom:1px dashed var(--line)}
.ledger tr.tot td{font-weight:600;border-bottom:1px solid var(--line2)}
.ledger td.r{text-align:right;font-family:var(--mono)}
.ledger .ok{color:var(--ok)} .ledger .wn{color:var(--wn)}
.locked{position:relative;border:1px dashed var(--line2);border-radius:var(--r);padding:12px 14px;background:var(--sub)}
.locked .lk{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* PO doc */
.doc{background:var(--card);border:1px solid var(--line2);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:26px;font-size:12px;font-family:var(--mono);position:relative}
.doc h4{font-family:"Geist",sans-serif;font-size:18px;letter-spacing:.06em}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc td,.doc th{border-bottom:1px solid #eee;padding:5px 4px;text-align:left}
.doc .hl{background:rgba(106,70,214,.12);outline:1px solid rgba(106,70,214,.5);border-radius:2px}
.doc .hlw{background:rgba(163,95,0,.14);outline:1px solid rgba(163,95,0,.6);border-radius:2px}
.scan{position:absolute;left:0;right:0;height:40px;background:linear-gradient(180deg,transparent,rgba(106,70,214,.18),transparent);animation:scan 1.4s linear infinite;pointer-events:none}
@keyframes scan{from{top:0}to{top:calc(100% - 40px)}}
.conf{font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* inbox list */
.inbox{display:flex;flex-direction:column}
.inbox button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.inbox button:hover{background:var(--sub)}
.inbox button[aria-current=true]{background:var(--acs)}
.inbox .src{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:600;font-family:var(--mono);color:var(--ink2)}
.inbox b{font-weight:600;font-size:13px} .inbox s{display:block;text-decoration:none;font-size:12px;color:var(--ink3)}

/* lanes */
  .inboxgrid{grid-template-columns:320px minmax(0,1fr)}
.lane{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.lane h3{display:flex;align-items:center;gap:8px}

/* toast & modal */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.tst{background:var(--ink);color:var(--on-ink);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .25s ease-out;max-width:90vw}
.tst.ai{background:var(--ai)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;background:var(--sub);margin:14px 0}

.concept{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:10px}
.concept .q{font-size:13px;color:var(--ink2)}
.concept .num{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.script li{padding:6px 0;color:var(--ink2)} .script li b{color:var(--ink)}
.sla{font-family:var(--mono);font-size:12px}
.fade{animation:fd .25s ease-out} @keyframes fd{from{opacity:0;transform:translateY(4px)}}

@media (max-width:1100px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/* ===== v2 visual layer: concept colours, icons, 21st.dev style components ===== */
:root{--c-b:#2f63ff;--c-a:#f59e0b;--c-v:#7c4dff;--c-g:#10a36a;--dk:#0a0c13}
.nav .ic i{font-size:17px;vertical-align:-3px}
.brand .lg{background:linear-gradient(135deg,#2f63ff,#7c4dff 60%,#f59e0b);box-shadow:0 6px 18px rgba(79,70,229,.35)}

/* hero */
.ov-hero{position:relative;overflow:hidden;border-radius:24px;background:var(--dk);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:24px;align-items:center;padding:56px 48px;min-height:520px;isolation:isolate}
.aurora{position:absolute;inset:0;z-index:-1;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;width:520px;height:520px;animation:drift 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#2f63ff;left:-120px;top:-180px}
.aurora i:nth-child(2){background:#7c4dff;right:-80px;top:40px;animation-delay:-5s;width:460px;height:460px}
.aurora i:nth-child(3){background:#f59e0b;left:30%;bottom:-320px;opacity:.6;animation-delay:-9s}
@keyframes drift{to{transform:translate(80px,40px) scale(1.15)}}
.ov-dots{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(ellipse at 30% 50%,#000 20%,transparent 70%)}
.badge-glow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#dfe4ff}
.badge-glow i{color:#ffc46b}
.ov-title{font-size:64px;line-height:1.02;letter-spacing:-.045em;font-weight:700;margin:22px 0 14px}
.shine{background:linear-gradient(90deg,#9db6ff,#c9b5ff,#ffd08a,#9db6ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.ov-sub{font-size:18px;color:#aab3cc;margin-bottom:28px}
.btn.glow{background:#fff;color:#0a0c13;border:0;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 10px 40px rgba(124,77,255,.55);font-weight:600}
.btn.glow:hover{background:#eef1ff}
.btn.ghost-d{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.18)}
.btn.ghost-d:hover{background:rgba(255,255,255,.12)}
.ov-live{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.ov-live span{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:#aab3cc;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.ov-live b{font-size:20px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}

/* animated beam */
.beam{position:relative;width:560px;height:440px}
.beam svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bm-base{fill:none;stroke:rgba(255,255,255,.12);stroke-width:2}
.bm-run{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 400;animation:beam 2.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes beam{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}
.bm-cart{position:absolute;left:0;top:136px;width:200px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.bm-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfd6ea;margin-bottom:10px;font-weight:500}
.bm-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 8px;border-radius:9px;background:rgba(255,255,255,.05);margin-top:6px}
.bm-item em{margin-left:auto;font-style:normal;font-family:var(--mono);color:#8f99b3;font-size:11.5px}
.sq{width:10px;height:10px;border-radius:3px;flex:none}
.bm-node{position:absolute;left:346px;width:214px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);animation:nodein .6s both}
.bm-node .ix{grid-row:span 2;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#0a0c13;font-size:18px}
.bm-node b{font-size:13.5px;font-weight:600} .bm-node small{font-size:11.5px;color:#9aa3bd}
@keyframes nodein{from{opacity:0;transform:translateX(12px)}}
.float-chip{position:absolute;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 14px;border-radius:99px;background:rgba(10,12,19,.75);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);color:#dfe4f2;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:bob 5s ease-in-out infinite}
.float-chip b{color:#fff}
.float-chip.f1{left:24px;top:30px} .float-chip.f2{left:40px;bottom:22px;animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-8px)}}

/* sections */
.ov-sec{margin-top:44px}
.sec-h{margin-bottom:18px}
.kick{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sec-h h2{font-size:30px;letter-spacing:-.03em;margin-top:6px;font-weight:650}

/* spotlight card base */
.spot{position:relative;overflow:hidden;isolation:isolate}
.spot::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c) 16%,transparent),transparent 60%)}
.spot:hover::before{opacity:1}

/* before / after */
.ba{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ba-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .25s,box-shadow .25s}
.ba-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(20,20,40,.08)}
.ba-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:500}
.ba-top i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.ba-old{margin-top:18px;font-size:15px;color:var(--ink3);text-decoration:line-through;text-decoration-color:#e5484d;text-decoration-thickness:2px}
.ba-new{font-size:40px;font-weight:700;letter-spacing:-.04em;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1}
.ba-bar{height:4px;border-radius:9px;background:var(--soft);margin-top:14px;overflow:hidden}
.ba-bar i{display:block;height:100%;width:100%;background:var(--c);transform-origin:left;animation:grow 1.2s .3s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleX(0)}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bento-card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;color:var(--ink);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,border-color .3s}
.bento-card:hover{text-decoration:none;transform:translateY(-4px);box-shadow:0 24px 60px rgba(20,20,40,.1);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.bento-card::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.bc-top{display:flex;align-items:center;gap:10px}
.bc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:#fff;background:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 35%,transparent)}
.bc-n{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.bc-st{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.bento-card h3{font-size:26px;letter-spacing:-.03em;margin-top:6px}
.bento-card p{color:var(--ink2);font-size:14px}
.bc-viz{height:150px;border-radius:16px;background:linear-gradient(180deg,var(--sub),var(--soft));border:1px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden;margin-top:4px}
.bc-chips{display:flex;gap:6px;flex-wrap:wrap}
.bc-chips span{font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);background:var(--card)}
.bc-cta{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--c)}
.bc-cta i{transition:transform .25s}
.bento-card:hover .bc-cta i{transform:translate(3px,-3px)}
/* mini visuals */
.mini-split{display:flex;align-items:center;gap:26px}
.ms-cart{width:58px;height:58px;border-radius:16px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:26px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.ms-lines{display:flex;flex-direction:column;gap:8px}
.ms-lines span{position:relative;font-size:12px;font-weight:600;padding:6px 14px 6px 22px;border-radius:9px;background:var(--card);border:1px solid var(--line);animation:slidein 2.8s var(--d) infinite}
.ms-lines span::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--col)}
@keyframes slidein{0%{opacity:0;transform:translateX(-40px)}18%,80%{opacity:1;transform:none}100%{opacity:0}}
.mini-ring{width:112px;height:112px;transform:rotate(-90deg)}
.mini-ring .tr{fill:none;stroke:var(--line);stroke-width:10}
.mini-ring .pr{fill:none;stroke:var(--c-a);stroke-width:10;stroke-linecap:round;stroke-dasharray:100;animation:ringfill 3s cubic-bezier(.22,1,.36,1) infinite}
@keyframes ringfill{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:12}}
.mini-ring-l{position:absolute;text-align:center} .mini-ring-l b{display:block;font-size:26px;letter-spacing:-.03em} .mini-ring-l small{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.mini-pipe{display:flex;gap:6px;width:82%}
.mini-pipe span{flex:1;height:30px;border-radius:7px;background:#e7e2fb;animation:pip 3.4s infinite}
.mini-pipe span.h{background:#fde7c1;animation-name:piph}
@keyframes pip{0%{background:#ece9f7}25%,85%{background:var(--c-v)}100%{background:#ece9f7}}
@keyframes piph{0%{background:#fbefd9}25%,85%{background:var(--c-a)}100%{background:#fbefd9}}
.mini-cap{position:absolute;bottom:12px;left:9%;right:9%;display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);font-family:var(--mono)}

/* journey timeline */
.jr{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding-top:4px}
.jr-line{position:absolute;left:7%;right:7%;top:30px;height:2px;background:var(--line2);border-radius:2px;overflow:hidden}
.jr-line i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c-b),var(--c-a),var(--c-v));transform-origin:left;animation:grow 1.8s .2s cubic-bezier(.22,1,.36,1) both}
.jr-step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:var(--ink);padding:0 4px 12px;border-radius:16px;animation:nodein .5s both}
.jr-step:hover{text-decoration:none}
.jr-dot{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card);color:var(--c);border:2px solid color-mix(in srgb,var(--c) 40%,var(--card));box-shadow:0 8px 22px color-mix(in srgb,var(--c) 18%,transparent);margin-bottom:8px;transition:transform .25s,background .25s,color .25s}
.jr-step:hover .jr-dot{transform:scale(1.1);background:var(--c);color:#fff}
.jr-dot em{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.jr-step b{font-size:13.5px;font-weight:600} .jr-step small{font-size:11.5px;color:var(--ink3)}

/* cast */
.ov-cast{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.cast{display:flex;gap:22px;flex-wrap:wrap;flex:1}
.cast-p{display:flex;align-items:center;gap:10px}
.cast-p b{display:block;font-size:13.5px} .cast-p small{color:var(--ink3);font-size:12px}
.ov-cast .ann{flex-basis:100%}

@media (max-width:1180px){.ov-hero{grid-template-columns:minmax(0,1fr)}.ov-copy{min-width:0}.beam{margin:0 auto;transform:scale(.9)}}
@media (max-width:980px){.ba{grid-template-columns:repeat(2,minmax(0,1fr))}.bento{grid-template-columns:1fr}.jr{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:22px}.jr-line{display:none}}
@media (max-width:640px){
  .ov-hero{padding:32px 20px;border-radius:18px}
  .ov-title{font-size:42px}
  .ov-hero .btn.lg{padding:10px 14px;font-size:14px}
  .ov-live span{padding:6px 10px}
  .beam{width:560px;transform:scale(.58);transform-origin:left top;height:440px;margin:0 0 -180px}
  .ba{grid-template-columns:1fr 1fr}.ba-new{font-size:30px}
  .jr{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===== OneCart 360 cart v2 ===== */
.oc-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 280px;gap:28px;align-items:center;padding:26px 28px;border-radius:24px;background:radial-gradient(600px 220px at 0% 0%,rgba(47,99,255,.10),transparent),radial-gradient(500px 240px at 100% 100%,rgba(124,77,255,.10),transparent),var(--card);border:1px solid var(--line);box-shadow:0 20px 50px rgba(20,20,40,.06)}
.oc-hero .kick{display:flex;align-items:center;gap:6px;color:var(--c-b)}
.oc-total{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.oc-total small{font-size:18px;color:var(--ink3);font-weight:600}
.oc-total span{font-size:54px;font-weight:700;letter-spacing:-.045em;line-height:1}
.eq{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.eq span{display:inline-flex;align-items:baseline;gap:4px;padding:5px 10px;border-radius:99px;background:var(--soft);font-size:12.5px;color:var(--ink2)}
.eq span b{font-size:16px;color:var(--ink)}
.eq span.hl{background:var(--ink);color:var(--on-ink);opacity:.92} .eq span.hl b{color:var(--on-ink)}
.eq>i{color:var(--ink3);font-size:13px}
.oc-mid{display:flex;align-items:center;gap:18px}
.donut{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;animation:spinin 1s cubic-bezier(.22,1,.36,1) both;box-shadow:0 10px 26px rgba(20,20,40,.12)}
.donut>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}
.donut b{font-size:26px;display:block} .donut small{font-size:11px;color:var(--ink3)}
@keyframes spinin{from{transform:rotate(-120deg) scale(.7);opacity:0}}
.lg-list{display:flex;flex-direction:column;gap:7px;font-size:13px}
.lg-list span{display:flex;align-items:center;gap:8px}
.lg-list i{width:10px;height:10px;border-radius:3px}
.lg-list em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:12px;margin-left:4px}
.cr-mini{padding:12px 14px;border-radius:14px;background:var(--sub);border:1px solid var(--line);font-size:12.5px;margin-bottom:12px}
.cr-mini .row span{color:var(--ink2)} .cr-mini .row i{color:var(--c-a)}
.cr-mini small{color:var(--ink3)}
.cr-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft);margin:9px 0 6px}
.cr-bar i{display:block;height:100%;background:var(--c-g);transform-origin:left;animation:grow 1.2s .2s cubic-bezier(.22,1,.36,1) both}
.cr-bar i.gap{background:repeating-linear-gradient(45deg,var(--c-a) 0 5px,#fbbf4d 5px 10px);animation-delay:1.1s}
.btn.cta-grad{background:linear-gradient(135deg,#111 0%,#2a2f45 100%);color:#fff;border:0;font-weight:600;box-shadow:0 12px 28px rgba(17,17,17,.25);position:relative;overflow:hidden}
.btn.cta-grad::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.5s 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(100%)}}
.btn.cta-grad:hover{background:linear-gradient(135deg,#222,#3a4060)}

.mk-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.mk-pill{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.mk-pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,20,40,.07)}
.mk-pill[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 12px 28px rgba(20,20,40,.12)}
.mk-code{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--soft);color:var(--ink2);font-family:var(--mono);flex:none}
.mk-pill[aria-pressed=true] .mk-code{background:var(--ink);color:var(--on-ink)}
.mk-t{min-width:0} .mk-t b{display:block;font-size:13px;font-weight:600} .mk-t small{display:block;font-size:11.5px;color:var(--ink3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-flag{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--c-a);color:#fff;display:grid;place-items:center;font-size:11px;box-shadow:0 0 0 3px var(--bg)}
.mk-flag.bad{background:var(--bad);right:16px}

.router{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);gap:0;align-items:center;padding:20px;border-radius:24px;background:var(--card);border:1px solid var(--line);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.rt-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rb-base{fill:none;stroke:#cdcdc4;stroke-width:1.8;stroke-dasharray:3 5}
.rb-run{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:40 600;animation:rbeam 2.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes rbeam{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
.rt-col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.rt-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:0 4px 2px}
.rt-head a{text-transform:none;letter-spacing:0;font-size:12.5px;display:flex;gap:4px;align-items:center}
.ln-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 16px rgba(20,20,40,.04);border-left:4px solid var(--c);animation:nodein .45s both}

function avail(mk,pt){var own=!pt||pt===BUYER.co, base=own?MK[mk].avail:MK[mk].limit*0.55;return Math.max(0,base-(S.used[ckey(mk,pt)]||0));}

function resolveRoute(prog,mk){
  var st=S.policy.routes[mk][prog];
  if(st!=="blocked") return {route:prog,restricted:st==="restricted",why:st==="restricted"?((WHY[mk]||{})[prog]||"Restricted in this market"):""};
  var why=(WHY[mk]||{})[prog]||"This programme is switched off for "+MK[mk].name+" in the route matrix.";
  var fb=FALLBACK[prog];
  if(fb && S.policy.routes[mk][fb]!=="blocked") return {route:fb,rerouted:true,from:prog,why:why};
  return {route:null,blocked:true,why:why};
}
/* items: [{sku,qty,price?}] price in AED base */
function calc(items,mk){
  var m=MK[mk],lines=[],tx={},net=0,margin=0,blocked=[];
  items.forEach(function(it){
    var p=PX[it.sku]; if(!p) return;
    var r=resolveRoute(p.prog,mk);
    var base=it.price!=null?it.price:p.price, unit=base*m.fx, ln=unit*it.qty;
    var cost=p.price*(1-p.mg/100)*m.fx, mgv=ln-cost*it.qty;
    var L={sku:p.id,name:p.name,vendor:p.vendor,qty:it.qty,unit:unit,net:ln,route:r.route,rr:r,margin:mgv,mgp:ln?mgv/ln*100:0,unitLabel:p.unit,base:base};
    lines.push(L);
    if(!r.route){blocked.push(L);return;}
    net+=ln; margin+=mgv;
    if(!tx[r.route]) tx[r.route]={route:r.route,lines:[],net:0};
    tx[r.route].lines.push(L); tx[r.route].net+=ln;
  });
  var txns=ROUTE_ORDER.filter(function(k){return tx[k];}).map(function(k){
    var t=tx[k],R=ROUTES[k];
    t.invoicer=R.inv==="aws"?"Amazon Web Services EMEA SARL":m.entity;
    t.byAws=R.inv==="aws"; t.tax=t.net*m.tax; t.total=t.net+t.tax; t.taxLabel=m.taxLabel; return t;
  });
  var tax=net*m.tax;
  return {mk:mk,cur:m.cur,lines:lines,txns:txns,net:net,tax:tax,total:net+tax,margin:margin,mgp:net?margin/net*100:0,blocked:blocked};
}
function credit(c){
  var a=avail(c.mk),gap=Math.max(0,c.total-a),m=MK[c.mk];
  return {limit:m.limit,used:m.limit-a,avail:a,total:c.total,gap:gap,released:Math.min(c.total,a),inBand:gap<=m.limit*S.policy.band/100};
}
function withDisc(c,iid){ var ins=INSTR.filter(function(x){return x.id===(iid||S.co.ins);})[0], p=(ins&&ins.disc)||0, o=Object.assign({},c); o.gross=c.total; o.discPct=p; o.disc=c.total*p/100; o.total=c.total-o.disc; return o; }
function carryCost(ins,c){ if(ins.carry) return c.total*COC*ins.days/365; if(ins.fund) return c.total*FEE; return 0; }
function aedEq(v,mk){return v/MK[mk].fx;}

function makeOrder(items,mk,o){
  var c=calc(items,mk);
  var ord={id:"RO-"+(S.seq++),src:o.src||"OneCart 360",buyer:o.buyer||BUYER.name,partner:o.partner||BUYER.co,customer:o.customer||"Desert Logistics LLC",
    market:mk,cur:c.cur,created:Date.now(),items:items,
    lines:c.lines.filter(function(l){return l.route;}).map(function(l){return {sku:l.sku,name:l.name,qty:l.qty,unit:l.unit,net:l.net,route:l.route,mgp:l.mgp,rerouted:!!l.rr.rerouted};}),
    txns:c.txns.map(function(t,i){return {route:t.route,invoicer:t.invoicer,byAws:t.byAws,net:t.net,tax:t.tax,total:t.total,taxLabel:t.taxLabel,status:"Queued",inv:null};}),
    net:c.net,tax:c.tax,total:c.total,mgp:c.mgp,
    credit:o.credit||null, po:o.po||null, quote:o.quote||null, flags:o.flags||{}, ok:{},

var timers={};
function holdFor(o,st){
  if(S.policy.agent[st]==="person" && !o.ok["manual_"+st]) return {kind:"manual",stage:st,text:"Policy sets this stage to a person. DealFlow prepared it and is waiting for sign off."};
  if(st==="validate" && o.flags.deviation && !o.ok.dev) return {kind:"deviation",stage:st,text:o.flags.deviation};
  if(st==="ready" && o.flags.readiness && !o.ok.ready) return {kind:"readiness",stage:st,text:o.flags.readiness};
  if(st==="credit"){
    if(o.mgp<S.policy.floor && !o.ok.margin) return {kind:"margin",stage:st,text:"Order margin "+pct(o.mgp)+" is below the "+S.policy.floor+"% floor."};
    if(!o.credit){ var a=avail(o.market,o.partner),gap=Math.max(0,o.total-a); o.credit={grade:"B+",avail:a,gap:gap,released:Math.min(o.total,a),opt:gap>0?"increase":null,ins:"open",inBand:gap<=MK[o.market].limit*S.policy.band/100,created:Date.now()}; }
    var cr=o.credit;
    if(cr.gap>0){
      if(cr.decision==="declined" && !cr.paid) return {kind:"paygap",stage:st,text:"Credit declined the increase. "+money(cr.gap,o.cur)+" must be paid or covered before the rest releases."};
      if(cr.opt==="increase" && !cr.decision) return {kind:"credit",stage:st,text:"Over the available limit by "+money(cr.gap,o.cur)+". "+money(cr.released,o.cur)+" released inside policy; the gap is with one reviewer."};
      if(cr.opt==="secure" && !cr.docOk) return {kind:"instrument",stage:st,text:"Waiting for a bank guarantee of "+money(cr.gap,o.cur)+" to lift the usable limit."};
      if(cr.opt==="pay" && !cr.paid) return {kind:"payment",stage:st,text:"Waiting for "+money(cr.gap,o.cur)+" by card or virtual IBAN. Releases as soon as it clears."};
    }
  }
  return null;
}
function stageText(o,st){
  var n=o.txns.length;
  switch(st){
    case "intake": return o.po? (o.po.via+" from "+o.po.from+" read: "+o.lines.length+" lines, customer, quote "+o.quote+", no re keying") : ("Cart submitted by "+o.buyer+": "+o.lines.length+" lines, approval "+(o.approval||"by rule"));
    case "validate": return "Price, quantity, customer, tax and terms checked against "+(o.quote?"quote "+o.quote:"the live price book")+(o.ok.dev?" (deviation resolved)":"");
    case "route": return n+" route"+(n>1?"s":"")+": "+o.txns.map(function(t){return ROUTES[t.route].short;}).join(", ")+". Entity "+MK[o.market].entity.split(",")[0]+(o.lines.some(function(l){return l.rerouted;})?". AWS line rerouted to resale":"");
    case "ready": return "KYC current, tax registration valid"+(o.txns.some(function(t){return t.route==="microsoft.csp";})?", Microsoft tenant linked":"")+(o.txns.some(function(t){return t.byAws;})?", AWS account ID confirmed":"");
    case "terms": return "Reseller terms"+(o.txns.some(function(t){return t.route.indexOf("microsoft")===0;})?", Microsoft Customer Agreement":"")+(o.txns.some(function(t){return t.byAws;})?", AWS private offer EULA":"")+" attached; no unapproved clause";
    case "credit": var c=o.credit; return "Margin "+pct(o.mgp)+" above the "+S.policy.floor+"% floor. "+(c.gap>0?("Gap "+money(c.gap,o.cur)+" covered: "+({increase:"temporary increase approved",pay:"partner paid the gap",secure:"guarantee received",trim:"order trimmed"}[c.opt]||"released")+"."):"Fully inside the available limit, released automatically.");
    case "erp": return "ERP sales order SO-"+(880000+parseInt(o.id.slice(3),10))+" created through the integration: "+n+" compliant transaction"+(n>1?"s":"");
    case "invoice": return n+" invoice"+(n>1?"s":"")+" issued per route. "+MK[o.market].einv+(o.txns.some(function(t){return t.byAws;})?"; AWS invoices its line directly":"");
    case "collect": return "Payments auto matched to invoices; credit freed";
    case "recon": return "Three way match complete; principal and agent split applied per line";
  }
  return "";
}
function stageEffect(o,st){
  if(st==="credit"){ var c=o.credit; var add=o.total-(c.opt==="pay"&&c.paid?c.gap:0); S.used[ckey(o.market,o.partner)]=(S.used[ckey(o.market,o.partner)]||0)+add; }
  if(st==="erp") o.txns.forEach(function(t){t.status="Booked";});
  if(st==="invoice"){
    o.txns.forEach(function(t,i){
      t.status="Invoiced";
      t.inv=(t.byAws?"AWS-":"INV-"+o.market.toUpperCase()+"-")+(o.id.slice(3))+"-"+(i+1);
      S.recon.unshift({id:t.inv,order:o.id,invoicer:t.byAws?"AWS":"Redington",route:t.route,cur:o.cur,amount:t.total,received:0,status:"awaiting",why:"",sug:null,market:o.market});
    });
  }
}
function advance(id){
  clearTimeout(timers[id]);
  var o=OX(id); if(!o||o.hold||o.stage>=8) return;
  var st=STAGES[o.stage].id, h=holdFor(o,st);

    if(h.kind==="payment") timers[id]=setTimeout(function(){ var x=OX(id); if(x&&x.hold&&x.hold.kind==="payment"){ x.credit.paid=true; x.timeline.push({t:Date.now(),stage:"credit",actor:"Partner",level:"person",text:"Paid "+money(x.credit.gap,x.cur)+" by virtual IBAN; auto matched"}); log("DealFlow AI","acts","Matched "+money(x.credit.gap,x.cur)+" virtual IBAN payment to "+id,id); x.hold=null; x.status="In progress"; save(); refresh(); advance(id);} },4200);
    save(); refresh(); return;
  }
  o.timeline.push({t:Date.now(),stage:st,actor:"DealFlow AI",level:S.policy.agent[st],text:stageText(o,st)});
  log("DealFlow AI",S.policy.agent[st],STAGES[o.stage].name+" for "+o.id,o.id);

  o.stage++;
  o.status=o.stage>=8?"Invoiced":"In progress";
  if(o.stage>=8) toast(o.id+" invoiced: "+o.txns.length+" compliant transactions","ai");

}
function release(o,actor,text,flag){

function finishCollect(o){

  }
}

var LASTTICK={};
function fx(){
  drawBeams(); setTimeout(drawBeams,60); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawBeams);
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  Array.prototype.forEach.call(document.querySelectorAll("[data-tick]"),function(el){
    var to=parseFloat(el.dataset.tick), from=parseFloat(el.dataset.from||0), dec=+(el.dataset.dec||0), t0=null, D=1100;
    var key=el.dataset.key; if(key){ if(LASTTICK[key]!=null) from=LASTTICK[key]; LASTTICK[key]=to; }
    if(reduce){el.textContent=to.toFixed(dec);return;}
    function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/D), e=1-Math.pow(1-p,3), v=from+(to-from)*e; el.textContent=dec?v.toFixed(dec):Math.round(v).toLocaleString("en-US"); if(p<1) requestAnimationFrame(step); }
    setTimeout(function(){requestAnimationFrame(step);},250);
  });
}

  var need=aedEq(c.total,S.market)>S.policy.buyerAuto;
  var o=makeOrder(items,S.market,{src:"OneCart 360",ref:S.co.po,approval:need?"approved by "+BUYER.approver+" in "+BUYER.tool:"by rule",
    credit:{grade:"B+",avail:cr.avail,gap:cr.gap,released:cr.released,opt:cr.gap?opt:null,ins:S.co.ins,inBand:cr.inBand,created:Date.now()}});
  if(c.discPct){ var k=1-c.discPct/100; o.discPct=c.discPct; o.disc=o.total*c.discPct/100; o.gross=o.total; o.total=o.total*k; o.txns.forEach(function(t){t.total=t.total*k;}); }
  log(BUYER.name,"person","Placed "+o.id+" from OneCart 360: "+money(o.total,o.cur)+", "+o.txns.length+" transactions",o.id);
  if(saved) { S.saved.push(saved); log("OneCart 360","acts","Moved "+saved.qty+" × "+PX[saved.sku].name+" to a saved quote at today's price",o.id); }
  S.cart=[]; S.co={step:1,ins:"open",opt:"increase",appr:null,checked:false,po:"GITS-PO-"+(7782+S.orders.length)};

  if(k==="askcert"){ o.flags.asked=true; log("Sara Nair","person","Requested renewed commercial registration from the partner",o.id); save(); refresh(); toast("Request sent to "+o.partner); return; }
  if(k==="revised") release(o,"Sara Nair","Revised PO received at the quoted price; deviation closed",function(){o.ok.dev=true; var l=o.lines.filter(function(x){return x.sku==="m365bp";})[0]; if(l) l.mgp=11.8;});
  if(k==="accept") release(o,"Sara Nair","Accepted the customer's price as a one off under Finance override (logged as a decision)",function(){o.ok.dev=true;});
  if(k==="cert") release(o,"Sara Nair","Renewed commercial registration received and verified",function(){o.ok.ready=true;});
  if(k==="manual") release(o,"Sara Nair","Signed off "+STAGES[o.stage].name,function(){o.ok["manual_"+STAGES[o.stage].id]=true;});
  if(k==="margin") release(o,"Finance","Approved margin below floor under override",function(){o.ok.margin=true;});
  toast("Released. DealFlow continues.","ai");
}
function creditDecision(id,d){
  var o=OX(id); if(!o) return;
  if(d==="approved") release(o,"Imran Qureshi","Approved a 30 day temporary increase of "+money(o.credit.gap,o.cur)+" (inside the reviewer band)",function(){o.credit.decision="approved";o.credit.by="Imran Qureshi";});
  if(d==="declined"){ o.credit.decision="declined"; o.credit.by="Imran Qureshi"; o.hold=null; log("Imran Qureshi","person","Declined the increase on "+o.id+"; partner asked to pay or cover the gap",o.id); o.timeline.push({t:Date.now(),stage:"credit",actor:"Imran Qureshi",level:"person",text:"Declined the temporary increase"}); save(); advance(o.id); }
  if(d==="instrument"){ o.credit.decision="guarantee requested"; o.credit.opt="secure"; o.credit.by="Imran Qureshi"; o.hold=null; o.timeline.push({t:Date.now(),stage:"credit",actor:"Imran Qureshi",level:"person",text:"Asked for a bank guarantee instead of an increase"}); log("Imran Qureshi","person","Asked for a bank guarantee on "+o.id,o.id); save(); advance(o.id); }
  toast("Decision recorded for "+o.id);
}
function simulatePayments(){
  var n=0;
  S.recon.forEach(function(r){
    if(r.status!=="awaiting") return; n++;
    if(r.invoicer==="AWS"){ r.received=Math.round(r.amount*0.97); r.status="exception"; r.kind="fee"; r.why="AWS disbursed "+money(r.received,r.cur)+". The "+money(r.amount-r.received,r.cur)+" difference is exactly the 3% listing fee on the private offer; nothing is short paid."; r.sug={label:"Post the fee to the agreed GL and close",level:"proposes"}; }
    else if(r.market==="ind"){ r.received=Math.round(r.amount*0.98); r.status="exception"; r.kind="tds"; r.why="2% short: TDS withheld at source. Request the certificate, not the cash."; r.sug={label:"Request the TDS certificate",level:"proposes"}; }
    else { r.received=r.amount; r.status="matched"; r.why="Exact match on amount and remittance reference."; }
  });
  S.orders.forEach(finishCollect);
  log("DealFlow AI","acts","Matched incoming payments and disbursements: "+n+" items","");
  save(); render(); toast(n+" payments processed","ai");
}
function fixRecon(id){
  var r=S.recon.filter(function(x){return x.id===id;})[0]; if(!r) return;
  var who=r.sug.level==="acts"?"DealFlow AI":"Sara Nair";
  if(r.kind==="cash"){ var k=ckey("uae"); S.used[k]=(S.used[k]||0)-64250; log("CreditIQ","acts","Freed AED 64,250 of "+BUYER.co+" credit after cash applied",""); }
  if(r.kind==="overdue"){ r.status="awaiting"; r.why="Reminder sent with the PO cross reference. Promise to pay logged for Friday."; r.sug=null; }
  else { r.status="matched"; r.why=r.why+" Resolved: "+r.sug.label.toLowerCase()+"."; r.sug=null; }
  log(who,who==="DealFlow AI"?"acts":"person","Reconciliation "+id+": "+(r.why.split("Resolved: ")[1]||"reminder sent"),r.order);
  S.orders.forEach(finishCollect);
  save(); render(); toast("Done and logged");
}

render();
})();
</script>
