<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procure to Pay Prototype</title>
<meta name="description" content="Working wireframe prototype of OneCart 360, CreditIQ and DealFlow AI: one partner checkout, credit at checkout, and PO to revenue orchestration." />
<link rel="icon" type="image/png" href="../assets/img/logo-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<style>
:root{
  --bg:#f5f5f3; --card:#fff; --ink:#141414; --ink2:#4d4d4d; --ink3:#8a8a86; --line:#e4e4df; --line2:#d3d3cd;
  --soft:#f0f0ec; --ac:#2453e6; --acs:#eaf0ff; --ok:#147a48; --oks:#e6f4ec; --wn:#a35f00; --wns:#fff3df;
  --bad:#c0332a; --bads:#fdecea; --ai:#6a46d6; --ais:#f0ebff; --note:#fff7c2; --noteb:#e9d55a;
  --r:10px; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Geist",system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.r{text-align:right} .nowrap{white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fbfbf9;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.brand .lg{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:13.5px} .brand s{display:block;text-decoration:none;color:var(--ink3);font-size:11.5px}
.sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 4px;font-weight:600}
.sec em{font-style:normal;text-transform:none;letter-spacing:0;display:block;font-weight:400;font-size:11.5px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--soft);text-decoration:none}
.nav[aria-current=true]{background:var(--ink);color:#fff}
.nav .ic{width:16px;text-align:center;opacity:.8;font-size:13px}
.nav .bd{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px;font-weight:600}
.nav .bd.n{background:var(--ac)} .nav .bd.g{background:var(--line2);color:var(--ink)}
.nav .tag{margin-left:auto;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.nav[aria-current=true] .tag{color:#bbb}
.side .foot{margin-top:auto;padding:12px 6px 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:4px 4px}
.sw{width:32px;height:18px;border-radius:99px;background:var(--line2);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.2s}
.sw[aria-pressed=true]{background:var(--ink)} .sw[aria-pressed=true]::after{left:16px}

.mainwrap{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:56px}
.top .crumb{font-size:12.5px;color:var(--ink3)} .top .crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 4px}
.persona i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--ac)}
.persona.ops i{background:var(--ai)} .persona.cr i{background:var(--wn)} .persona.ad i{background:var(--ink)}
.mk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.mk select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px}
.menu-b{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
main{padding:24px 28px 80px;max-width:1280px}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{padding:0;overflow:hidden}
.card h2+p,.card h3+p{margin-top:4px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd p{color:var(--ink2);max-width:720px;margin-top:4px}
.pagehd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehd p{color:var(--ink2);margin-top:6px;max-width:760px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.split.w{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.hr{height:1px;background:var(--line);margin:14px 0}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)} .btn.pri:hover{background:#333}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#f0c4c0}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:11px 18px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--oks);color:var(--ok)} .pill.wn{background:var(--wns);color:var(--wn)} .pill.bad{background:var(--bads);color:var(--bad)}
.pill.ac{background:var(--acs);color:var(--ac)} .pill.ai{background:var(--ais);color:var(--ai)} .pill.ink{background:var(--ink);color:#fff}
.pill.out{background:#fff;border-color:var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink3)} .kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi .v.ok{color:var(--ok)} .kpi .v.wn{color:var(--wn)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafaf8;white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:#fafaf8}
.t tr.tot td{font-weight:600;background:#fafaf8}
.t td.r,.t th.r{text-align:right}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.ok{background:var(--ok)} .bar i.wn{background:var(--wn)} .bar i.ac{background:var(--ac)} .bar i.bad{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.inp{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 10px;width:100%}
.inp:focus{outline:2px solid var(--acs);border-color:var(--ac)}
.qty{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.qty button{border:0;background:#fff;width:28px;cursor:pointer} .qty button:hover{background:var(--soft)}
.qty input{width:56px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:5px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:36px;text-align:center;color:var(--ink3);background:#fbfbf9}
.ph{background:repeating-linear-gradient(135deg,#f1f1ed 0 8px,#ebebe6 8px 16px);border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:11px;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-weight:500}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)} .list>div:last-child{border-bottom:0}

/* annotations */
.ann{background:var(--note);border:1px solid var(--noteb);border-radius:8px;padding:8px 11px;font-size:12px;color:#5b4d00;display:flex;gap:8px;align-items:flex-start}
.ann b{font-weight:600;white-space:nowrap}
.ann::before{content:"✎";font-size:12px}
body.no-notes .ann{display:none !important}

/* stepper */
.stepper{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-bottom:16px}
.stepper button{flex:1;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;border-right:1px solid var(--line)}
.stepper button:last-child{border-right:0}
.stepper i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;flex:none}
.stepper b{font-weight:500;font-size:13px} .stepper s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink3)}
.stepper .on{background:#fafaf8} .stepper .on i{background:var(--ink);color:#fff;border-color:var(--ink)}
.stepper .dn i{background:var(--ok);color:#fff;border-color:var(--ok)}
.stepper button[disabled]{cursor:not-allowed;opacity:.55}

/* pipeline */
.pipe{display:flex;gap:4px}
.pipe span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pipe span.d{background:var(--ok)} .pipe span.c{background:var(--ac);animation:pulse 1s infinite} .pipe span.h{background:var(--wn)}
@keyframes pulse{50%{opacity:.4}}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.tl .e{position:relative;padding:0 0 14px}
.tl .e::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--ok)}
.tl .e.p::before{border-color:var(--wn)} .tl .e.h::before{border-color:var(--ac)} .tl .e.x::before{border-color:var(--line2)}
.tl .e .m{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl .e .tx{font-size:13px;margin-top:2px}
.stg{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.stg:last-child{border-bottom:0}
.stg .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:11px;font-weight:600;color:var(--ink3)}
.stg.d .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stg.c .n{background:var(--ac);border-color:var(--ac);color:#fff}
.stg.h{background:var(--wns)} .stg.h .n{background:var(--wn);border-color:var(--wn);color:#fff}
.stg.f{color:var(--ink3)}

/* product tiles */
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.tile .ph{height:84px}
.tile .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.tile .pr{font-size:15px;font-weight:600} .tile .pr s{text-decoration:none;color:var(--ink3);font-weight:400;font-size:12px}
.tile .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* route groups */
.txn{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.txn .th{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fafaf8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.txn .th .ix{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.txn.aws .th .ix{background:var(--wn)} .txn.ms .th .ix{background:var(--ac)} .txn.svc .th .ix{background:var(--ai)}
.txn .tb{padding:4px 14px}
.txn .ln{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.txn .ln:last-child{border-bottom:0}
.txn .tf{display:flex;gap:18px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.txn .tf b{color:var(--ink)}
.flag{border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.flag.wn{background:var(--wns);color:#6d4000} .flag.bad{background:var(--bads);color:#7c1e17} .flag.ok{background:var(--oks);color:#0d5130} .flag.ai{background:var(--ais);color:#3f2596} .flag.ac{background:var(--acs);color:#173a9e}
.flag b{font-weight:600}

/* options */
.opt{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);margin-top:2px}
.opt[aria-pressed=true] .rd{border:5px solid var(--ink)}
.opt b{font-weight:600;font-size:13px} .opt .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.opt .fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt .fx span{font-size:11.5px;background:var(--soft);border-radius:6px;padding:2px 7px;font-family:var(--mono)}
.opt .side-v{text-align:right;font-size:13px;font-weight:600} .opt .side-v em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400}
.optlist{display:flex;flex-direction:column;gap:8px}

/* credit */
.grade{width:76px;height:76px;border-radius:50%;border:6px solid var(--ok);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.sig{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.sig:last-child{border-bottom:0}
.sig s{display:block;text-decoration:none;color:var(--ink3);font-size:12px}
.sig.pend{opacity:.35}
.ledger{font-size:13px;width:100%;border-collapse:collapse}
.ledger td{padding:7px 0;border-bottom:1px dashed var(--line)}
.ledger tr.tot td{font-weight:600;border-bottom:1px solid var(--line2)}
.ledger td.r{text-align:right;font-family:var(--mono)}
.ledger .ok{color:var(--ok)} .ledger .wn{color:var(--wn)}
.locked{position:relative;border:1px dashed var(--line2);border-radius:var(--r);padding:12px 14px;background:#fbfbf9}
.locked .lk{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* PO doc */
.doc{background:#fff;border:1px solid var(--line2);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:26px;font-size:12px;font-family:var(--mono);position:relative}
.doc h4{font-family:"Geist",sans-serif;font-size:18px;letter-spacing:.06em}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc td,.doc th{border-bottom:1px solid #eee;padding:5px 4px;text-align:left}
.doc .hl{background:rgba(106,70,214,.12);outline:1px solid rgba(106,70,214,.5);border-radius:2px}
.doc .hlw{background:rgba(163,95,0,.14);outline:1px solid rgba(163,95,0,.6);border-radius:2px}
.scan{position:absolute;left:0;right:0;height:40px;background:linear-gradient(180deg,transparent,rgba(106,70,214,.18),transparent);animation:scan 1.4s linear infinite;pointer-events:none}
@keyframes scan{from{top:0}to{top:calc(100% - 40px)}}
.conf{font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* inbox list */
.inbox{display:flex;flex-direction:column}
.inbox button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.inbox button:hover{background:#fafaf8}
.inbox button[aria-current=true]{background:var(--acs)}
.inbox .src{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:600;font-family:var(--mono);color:var(--ink2)}
.inbox b{font-weight:600;font-size:13px} .inbox s{display:block;text-decoration:none;font-size:12px;color:var(--ink3)}

/* lanes */
  .inboxgrid{grid-template-columns:320px minmax(0,1fr)}
.lane{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.lane h3{display:flex;align-items:center;gap:8px}

/* toast & modal */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.tst{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .25s ease-out;max-width:90vw}
.tst.ai{background:var(--ai)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;background:#fbfbf9;margin:14px 0}

.concept{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px}
.concept .q{font-size:13px;color:var(--ink2)}
.concept .num{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.script li{padding:6px 0;color:var(--ink2)} .script li b{color:var(--ink)}
.sla{font-family:var(--mono);font-size:12px}
.fade{animation:fd .25s ease-out} @keyframes fd{from{opacity:0;transform:translateY(4px)}}

@media (max-width:1100px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  body.menu .side{transform:none}
  .menu-b{display:block}

function calc(items,mk){

    tx[r.route].lines.push(L); tx[r.route].net+=ln;

    {id:"trim",t:"Reduce the order to fit",tag:"Releases now",d:trimInfo?trimInfo.n+" × "+trimInfo.name+" move to a saved quote at today's price.":"No line can be trimmed to fit.",f:trimInfo?["Removes "+money(trimInfo.v),"No payment today","Fits inside the limit"]:["Not available"],dis:!trimInfo},
    {id:"secure",t:"Cover it with a bank guarantee",tag:"Same day",d:"A guarantee lifts the usable limit; no balance sheet exposure for us.",f:["Clears "+money(cr.gap),"Partner pays the bank fee"]}
  ];
  var right="<div class='stack'>"+
    "<div class='card'><h3>The credit answer</h3><div style='margin-top:10px'>"+ledger+"</div>"+
      (cr.gap?"<div class='flag wn' style='margin-top:12px'><span>!</span><span><b>Not a rejection.</b> "+money(cr.gap)+" is over the available limit. Pick how to cover it below; you see the answer before you submit.</span></div>":"<div class='flag ok' style='margin-top:12px'><span>✓</span><span><b>Approved.</b> The whole order fits inside your available limit.</span></div>")+"</div>"+
    (cr.gap?"<div class='card'><h3>Cover the gap</h3><div class='optlist' style='margin-top:10px'>"+OPTS.map(function(o){

function trimPlan(c,cr){
  if(!cr.gap) return null;
  var m=MK[S.market], best=null;
  c.lines.forEach(function(l){
    if(PX[l.sku].prog!=="redington.stock"&&PX[l.sku].prog!=="redington.services") return;
    var per=l.unit*(1+m.tax), n=Math.ceil(cr.gap/per);
    if(n<l.qty && (!best||n*per<best.v)) best={sku:l.sku,name:l.name,n:n,v:n*l.unit};
  });
  return best;
}

  if(h.kind==="manual"){ prop="Everything checks out. Sign off to continue."; btns="<button class='btn pri sm' data-act='res' data-k='manual' data-id='"+o.id+"'>Sign off "+STAGES[o.stage].short+"</button>"; }
  if(h.kind==="margin"){ prop="Send back to the partner to reprice, or approve under Finance override."; btns="<button class='btn sm' data-act='res' data-k='margin' data-id='"+o.id+"'>Approve with Finance override</button>"; }

    "<div class='row' style='margin-top:12px'>"+btns+"<a class='btn sm' href='#/order/"+o.id+"' style='margin-left:auto'>Order →</a></div></div>";

      STAGES.map(function(s,i){return "<tr><td class='mono'>"+(i+1)+"</td><td>"+s.name+"</td><td><select class='inp' style='max-width:200px;padding:4px 6px' data-act='ag' data-s='"+s.id+"'>"+Object.keys(LV).map(function(k){return "<option value='"+k+"'"+(p.agent[s.id]===k?" selected":"")+">"+LV[k][0]+"</option>";}).join("")+"</select></td></tr>";}).join("")+
      "<tr><td class='mono'>—</td><td><b>Approve its own order, change a credit limit, issue a credit note</b></td><td>"+pill("Never, at any level","bad")+" <span class='muted' style='font-size:12px'>locked</span></td></tr>"+
      "</tbody></table></div>"+
    "<div class='g g4'>"+[["Accountable","A named business owner, never the agent."],["Escalate","High value and non standard, always."],["Override","Available everywhere, and logged as a decision."],["Audit","AI actions sit beside user actions."]].map(function(g){return "<div class='lane'><h3>"+g[0]+"</h3><p class='ink2' style='font-size:12.5px;margin-top:6px'>"+g[1]+"</p></div>";}).join("")+"</div>"+
    ann("Fund these first: master data and the policy and rules engine. Everything else assumes them.","The ask")+
    "</div>";
};

/* ============================================================
   Events
   ============================================================ */
function go(h){ if(location.hash===h) render(); else location.hash=h; }
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]"); if(g && !e.target.closest("a,button:not([data-go])")){ go(g.dataset.go); return; }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case "menu": document.body.classList.toggle("menu"); break;
    case "notes": S.notes=!S.notes; save(); render(); break;
    case "reset": if(confirm("Reset all demo data?")){ Object.keys(timers).forEach(function(k){clearTimeout(timers[k]);}); S=seed(); seedHistory(); save(); go("#/overview"); toast("Demo data reset"); } break;
    case "toast": toast(b.dataset.t); break;
    case "cv": CF.v=b.dataset.v; render(); break;
    case "add": var ex=S.cart.filter(function(c){return c.sku===b.dataset.sku;})[0]; if(ex) ex.qty++; else S.cart.push({sku:b.dataset.sku,qty:PX[b.dataset.sku].unit.indexOf("seat")>=0?10:1}); S.co.checked=false; save(); render(); toast("Added to OneCart 360"); break;
    case "qty": var it=S.cart.filter(function(c){return c.sku===b.dataset.sku;})[0]; if(it){ it.qty=Math.max(1,it.qty+(+b.dataset.d)*(it.qty>=20?10:1)); S.co.checked=false; save(); render(); } break;
    case "rm": S.cart=S.cart.filter(function(c){return c.sku!==b.dataset.sku;}); save(); render(); break;
    case "clearcart": S.cart=[]; save(); render(); break;
    case "democart": S.cart=seed().cart; save(); render(); break;
    case "setmk": S.market=b.dataset.mk; S.co.checked=false; save(); render(); break;
    case "checkout": S.co.step=1; S.co.checked=false; S.co.appr=null; save(); go("#/checkout"); break;
    case "step": var n=+b.dataset.s; if(n===3&&!S.co.checked) n=2; S.co.step=n; save(); render(); window.scrollTo(0,0); break;
    case "ins": S.co.ins=b.dataset.i; save(); keepScroll(); break;
    case "opt": S.co.opt=b.dataset.o; save(); keepScroll(); break;
    case "sendappr": S.co.appr="pending"; save(); render(); log(BUYER.name,"person","Sent cart to "+BUYER.approver+" in "+BUYER.tool+" for approval",""); setTimeout(function(){S.co.appr="approved";S.co.apprAt=Date.now();log(BUYER.approver,"person","Approved in "+BUYER.tool+" (signed mandate)","");save(); if(route().r==="checkout") keepScroll(); toast(BUYER.approver+" approved in "+BUYER.tool);},1600); break;
    case "place": placeCart(); break;
    case "upload": openUpload(); break;
    case "closemodal": $("#modal").innerHTML=""; break;
    case "douploadpo": $("#modal").innerHTML=""; partnerUpload(); break;
    case "runpo": runPO(id); break;
    case "newpo": newPO(); break;
    case "res": resolve(id,b.dataset.k); break;
    case "cdec": creditDecision(id,b.dataset.d); break;
    case "paygap": var o=OX(id); o.credit.paid=true; release(o,o.buyer,"Paid "+money(o.credit.gap,o.cur)+" by card to release the rest"); break;
    case "uploadbg": var o2=OX(id); release(o2,o2.hold&&route().r==="exceptions"?"Sara Nair":o2.buyer,"Bank guarantee for "+money(o2.credit.gap,o2.cur)+" received and verified with the issuing bank",function(){o2.credit.docOk=true;}); break;
    case "payments": simulatePayments(); break;
    case "rfix": fixRecon(id); break;
    case "af": AF=b.dataset.f; render(); break;
  }
});
function keepScroll(){ var y=window.scrollY; $("#main").innerHTML="<div>"+VIEWS[route().r](route().a)+"</div>"; window.scrollTo(0,y); }
document.addEventListener("input",function(e){
  var t=e.target, a=t.dataset.act;
  if(a==="cq"){ CF.q=t.value; var g=$("#grid"); if(g){ g.innerHTML=P.filter(function(p){return (CF.v==="All"||p.vendor===CF.v)&&(!CF.q||(p.name+" "+p.vendor+" "+p.cat).toLowerCase().indexOf(CF.q.toLowerCase())>=0);}).map(tile).join(""); } }
  if(a==="poin"){ S.co.po=t.value; save(); }
});
document.addEventListener("change",function(e){
  var t=e.target, a=t.dataset.act;
  if(a==="market"){ S.market=t.value; S.co.checked=false; save(); render(); toast("Buying in "+MK[S.market].name+": routes, tax and entity re-resolved"); }
  if(a==="qtyset"){ var it=S.cart.filter(function(c){return c.sku===t.dataset.sku;})[0]; if(it){ it.qty=Math.max(1,parseInt(t.value,10)||1); S.co.checked=false; save(); render(); } }
  if(a==="pol"){ var v=parseFloat(t.value); if(!isNaN(v)){ var old=S.policy[t.dataset.k]; S.policy[t.dataset.k]=v; log("Policy owner","rules","Changed "+t.dataset.k+" from "+old+" to "+v,""); save(); toast("Policy updated and logged"); renderSide(); } }
  if(a==="rt"){ S.policy.routes[t.dataset.mk][t.dataset.r]=t.value; log("Policy owner","rules","Route matrix: "+ROUTES[t.dataset.r].name+" in "+MK[t.dataset.mk].name+" set to "+t.value,""); save(); render(); toast("Route matrix updated: carts re-route on next view"); }
  if(a==="ag"){ S.policy.agent[t.dataset.s]=t.value; log("Policy owner","rules","Agent authority at "+t.dataset.s+" set to "+LV[t.value][0],""); save(); toast("Agent authority updated"); }
});
window.addEventListener("hashchange",function(){ render(); window.scrollTo(0,0); });

/* ============================================================
   Actions
   ============================================================ */
function placeCart(){
  var items=S.cart.map(function(c){return {sku:c.sku,qty:c.qty};}), c=calc(items,S.market), cr=credit(c), opt=cr.gap?S.co.opt:null, saved=null;
  if(opt==="trim"){ var tp=trimPlan(c,cr); if(tp){ items.forEach(function(i){ if(i.sku===tp.sku) i.qty-=tp.n; }); saved={sku:tp.sku,qty:tp.n}; c=calc(items,S.market); cr=credit(c); } }
  var need=aedEq(c.total,S.market)>S.policy.buyerAuto;
  var o=makeOrder(items,S.market,{src:"OneCart 360",ref:S.co.po,approval:need?"approved by "+BUYER.approver+" in "+BUYER.tool:"by rule",
    credit:{grade:"B+",avail:cr.avail,gap:cr.gap,released:cr.released,opt:cr.gap?opt:null,ins:S.co.ins,inBand:cr.inBand,created:Date.now()}});
  log(BUYER.name,"person","Placed "+o.id+" from OneCart 360: "+money(o.total,o.cur)+", "+o.txns.length+" transactions",o.id);
  if(saved) { S.saved.push(saved); log("OneCart 360","acts","Moved "+saved.qty+" × "+PX[saved.sku].name+" to a saved quote at today's price",o.id); }
  S.cart=[]; S.co={step:1,ins:"open",opt:"increase",appr:null,checked:false,po:"GITS-PO-"+(7782+S.orders.length)};
  save(); go("#/order/"+o.id); toast(o.id+" placed. DealFlow is running it.","ai");
  setTimeout(function(){advance(o.id);},500);
}
function runPO(id){
  var po=POX(id); if(!po||po.status!=="new") return;
  po.status="reading"; save(); refresh();
  log("DealFlow AI","acts","Reading "+po.id+" ("+po.via+")",po.id);
  setTimeout(function(){
    var flags={};
    if(po.issue==="deviation") flags.deviation="Customer PO prices Microsoft 365 at "+MK[po.market].cur+" "+fmt(80*MK[po.market].fx)+" a seat against "+fmt(82*MK[po.market].fx)+" on quote "+po.quote+". Line margin 9.6% is below the "+S.policy.floor+"% floor.";
    if(po.issue==="readiness") flags.readiness="The partner's commercial registration for this customer expired on 30 Sep 2026. Invoices cannot be issued against it.";
    var o=makeOrder(po.lines.map(function(l){return {sku:l.sku,qty:l.qty,price:l.price};}),po.market,{src:"Customer PO",customer:po.customer,partner:po.partner,po:{via:po.via,from:po.from},quote:po.quote,flags:flags});
    po.status="ordered"; po.order=o.id; save(); refresh(); toast(po.id+" read: "+o.id+" created","ai");
    setTimeout(function(){advance(o.id);},300);
  },1800);
}
var NEWPOS=[
  {id:"PO-SR-5530",from:"buying@sandrose.ae",via:"Email, PDF",src:"PDF",customer:"Sand Rose Hotels",partner:"Nexa Systems FZ LLC",market:"uae",quote:"Q-22951",lines:[{sku:"r760",qty:2,price:38500},{sku:"fg100f",qty:1,price:14200}],issue:null},
  {id:"PO-AK-7712",from:"procure@alkhobar-eng.sa",via:"Email, PDF",src:"PDF",customer:"Al Khobar Engineering",partner:"Najd Digital Co.",market:"ksa",quote:"Q-22960",lines:[{sku:"cloudguard",qty:80,price:220},{sku:"m365bp",qty:80,price:82}],issue:null},
  {id:"PO-MC-0118",from:"Partner portal upload",via:"Upload, PDF",src:"UP",customer:"Meridian Clinics",partner:"Gulf IT Solutions LLC",market:"uae",quote:"Q-22966",lines:[{sku:"copilot",qty:20,price:110}],issue:null}
];
function newPO(){
  var used=S.pos.map(function(p){return p.id;}), n=NEWPOS.filter(function(p){return used.indexOf(p.id)<0&&p.src!=="UP";})[0];
  if(!n){ toast("No more sample POs"); return; }
  var p=JSON.parse(JSON.stringify(n)); p.received=tm(Date.now()); p.status="new"; S.pos.unshift(p);
  log("DealFlow AI","acts","New PO "+p.id+" received from "+p.from,p.id); save(); go("#/inbox/"+p.id); toast("New email PO from "+p.from,"ai");
}
function openUpload(){
  $("#modal").innerHTML="<div class='modal-bg' data-act='closemodal'><div class='modal' data-act='noop'><h2>Upload a customer PO</h2><p class='ink2' style='margin-top:4px'>PDF, scan, Excel or forward the email to po@redington.example. DealFlow reads it, checks it against your quote and builds the order.</p>"+
    "<div class='drop'><div style='font-size:26px'>⇪</div><b>Drop a file here</b><div class='muted' style='font-size:12px'>or use the sample below</div></div>"+
    "<div class='row sb' style='border:1px solid var(--line);border-radius:8px;padding:10px 12px'><span class='mono'>PO_Meridian_Clinics.pdf · 84 KB</span><button class='btn ai sm' data-act='douploadpo'>Upload sample</button></div>"+
    "<div class='row' style='justify-content:flex-end;margin-top:14px'><button class='btn' data-act='closemodal'>Cancel</button></div></div></div>";
}
function partnerUpload(){
  var n=NEWPOS[2], ex=POX(n.id);
  if(ex){ toast("That PO was already uploaded"); return; }
  var p=JSON.parse(JSON.stringify(n)); p.received=tm(Date.now()); p.status="new"; S.pos.unshift(p);
  log(BUYER.name,"person","Uploaded "+p.id+" in the partner portal",p.id); save();
  toast("DealFlow is reading PO_Meridian_Clinics.pdf…","ai");
  runPO(p.id);
  setTimeout(function(){ var q=POX(p.id); if(q&&q.order){ go("#/order/"+q.order); } },2200);
}
function resolve(id,k){
  var o=OX(id); if(!o) return;
  if(k==="ask"){ o.flags.asked=true; o.timeline.push({t:Date.now(),stage:"validate",actor:"DealFlow AI",level:"proposes",text:"Drafted email to "+o.customer+" asking for a revised PO at the quoted price; sent by Sara Nair"}); log("Sara Nair","person","Sent DealFlow's drafted email for a revised PO",o.id); save(); refresh(); toast("Email sent. DealFlow will remind in 24h","ai"); return; }
  if(k==="askcert"){ o.flags.asked=true; log("Sara Nair","person","Requested renewed commercial registration from the partner",o.id); save(); refresh(); toast("Request sent to "+o.partner); return; }
  if(k==="revised") release(o,"Sara Nair","Revised PO received at the quoted price; deviation closed",function(){o.ok.dev=true; var l=o.lines.filter(function(x){return x.sku==="m365bp";})[0]; if(l) l.mgp=11.8;});
  if(k==="accept") release(o,"Sara Nair","Accepted the customer's price as a one off under Finance override (logged as a decision)",function(){o.ok.dev=true;});
  if(k==="cert") release(o,"Sara Nair","Renewed commercial registration received and verified",function(){o.ok.ready=true;});
  if(k==="manual") release(o,"Sara Nair","Signed off "+STAGES[o.stage].name,function(){o.ok["manual_"+STAGES[o.stage].id]=true;});
  if(k==="margin") release(o,"Finance","Approved margin below floor under override",function(){o.ok.margin=true;});
  toast("Released. DealFlow continues.","ai");
}
function creditDecision(id,d){
  var o=OX(id); if(!o) return;
  if(d==="approved") release(o,"Imran Qureshi","Approved a 30 day temporary increase of "+money(o.credit.gap,o.cur)+" (inside the reviewer band)",function(){o.credit.decision="approved";o.credit.by="Imran Qureshi";});
  if(d==="declined"){ o.credit.decision="declined"; o.credit.by="Imran Qureshi"; o.hold=null; log("Imran Qureshi","person","Declined the increase on "+o.id+"; partner asked to pay or cover the gap",o.id); o.timeline.push({t:Date.now(),stage:"credit",actor:"Imran Qureshi",level:"person",text:"Declined the temporary increase"}); save(); advance(o.id); }
  if(d==="instrument"){ o.credit.decision="guarantee requested"; o.credit.opt="secure"; o.credit.by="Imran Qureshi"; o.hold=null; o.timeline.push({t:Date.now(),stage:"credit",actor:"Imran Qureshi",level:"person",text:"Asked for a bank guarantee instead of an increase"}); log("Imran Qureshi","person","Asked for a bank guarantee on "+o.id,o.id); save(); advance(o.id); }
  toast("Decision recorded for "+o.id);
}
function simulatePayments(){
  var n=0;
  S.recon.forEach(function(r){
    if(r.status!=="awaiting") return; n++;
    if(r.invoicer==="AWS"){ r.received=Math.round(r.amount*0.97); r.status="exception"; r.kind="fee"; r.why="AWS disbursed "+money(r.received,r.cur)+". The "+money(r.amount-r.received,r.cur)+" difference is exactly the 3% listing fee on the private offer; nothing is short paid."; r.sug={label:"Post the fee to the agreed GL and close",level:"proposes"}; }
    else if(r.market==="ind"){ r.received=Math.round(r.amount*0.98); r.status="exception"; r.kind="tds"; r.why="2% short: TDS withheld at source. Request the certificate, not the cash."; r.sug={label:"Request the TDS certificate",level:"proposes"}; }
    else { r.received=r.amount; r.status="matched"; r.why="Exact match on amount and remittance reference."; }
  });
  S.orders.forEach(finishCollect);
  log("DealFlow AI","acts","Matched incoming payments and disbursements: "+n+" items","");
  save(); render(); toast(n+" payments processed","ai");
}
function fixRecon(id){
  var r=S.recon.filter(function(x){return x.id===id;})[0]; if(!r) return;
  var who=r.sug.level==="acts"?"DealFlow AI":"Sara Nair";
  if(r.kind==="cash"){ var k=ckey("uae"); S.used[k]=(S.used[k]||0)-64250; log("CreditIQ","acts","Freed AED 64,250 of "+BUYER.co+" credit after cash applied",""); }
  if(r.kind==="overdue"){ r.status="awaiting"; r.why="Reminder sent with the PO cross reference. Promise to pay logged for Friday."; r.sug=null; }
  else { r.status="matched"; r.why=r.why+" Resolved: "+r.sug.label.toLowerCase()+"."; r.sug=null; }
  log(who,who==="DealFlow AI"?"acts":"person","Reconciliation "+id+": "+(r.why.split("Resolved: ")[1]||"reminder sent"),r.order);
  S.orders.forEach(finishCollect);
  save(); render(); toast("Done and logged");
}

render();
})();
</script>
